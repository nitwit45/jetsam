[package]
name = "jetsam"
version = "0.1.0"
description = "macOS disk and memory cleaner for developers: caches, build artefacts, Docker leftovers and RAM reclaim, never touching git-tracked files or user data"
authors = ["Nithila Ariyapperuma"]
license = "MIT"
repository = "https://github.com/nitwit45/jetsam"
edition = "2021"
publish = false

[lib]
name = "jetsam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
jwalk = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
trash = "5"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
