name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches every version field
        run: |
          tag="${GITHUB_REF_NAME#v}"
          status=0
          check() {
            if [ "$2" != "$tag" ]; then
              echo "::error file=$1::version is $2, tag is $tag"
              status=1
            fi
          }
          check src-tauri/tauri.conf.json "$(jq -r .version src-tauri/tauri.conf.json)"
          check package.json "$(jq -r .version package.json)"
          check src-tauri/Cargo.toml "$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)"
          exit "$status"

  check:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    needs: [version, check]
    runs-on: macos-latest
    permissions:
      contents: write # create the draft release and upload its assets
      id-token: write # sign the build provenance attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No caches in a release build: a poisoned cache cannot reach a published DMG.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
          no-cache: true

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      # Universal binary, ad-hoc signed (bundle.macOS.signingIdentity "-" in tauri.conf.json).
      - name: Build Jetsam.app and the DMG
        run: bun run tauri build --target universal-apple-darwin --bundles dmg

      # The asset keeps one stable name so releases/latest/download/Jetsam.dmg never goes stale.
      - name: Stage Jetsam.dmg and its checksum
        run: |
          shopt -s nullglob
          dmgs=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "::error::expected one DMG, found ${#dmgs[@]}: ${dmgs[*]}"
            exit 1
          fi
          mkdir -p out
          cp "${dmgs[0]}" out/Jetsam.dmg
          (cd out && shasum -a 256 Jetsam.dmg > Jetsam.dmg.sha256)
          cat out/Jetsam.dmg.sha256

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/Jetsam.dmg

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The body of the "## [x.y.z]" (or "## x.y.z") section, up to the next "## " heading.
          awk -v v="$version" '
            /^## / {
              if (found) exit
              if (index($0, "[" v "]") || $2 == v) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > out/notes.md
          if ! grep -q '[^[:space:]]' out/notes.md; then
            echo "::error file=CHANGELOG.md::no \"## [$version]\" section; add it before tagging"
            exit 1
          fi
          sum="$(cut -d ' ' -f 1 out/Jetsam.dmg.sha256)"
          cat >> out/notes.md <<'NOTES'

          ### Install

          Download Jetsam.dmg below, open it and drag Jetsam to Applications. It is not signed with an Apple Developer ID, so macOS blocks the first launch: see [Opening an unsigned build](https://github.com/@REPO@#opening-an-unsigned-build).

          | File | SHA-256 |
          |---|---|
          | Jetsam.dmg | `@SUM@` |

          ```sh
          shasum -a 256 -c Jetsam.dmg.sha256
          gh attestation verify Jetsam.dmg --repo @REPO@
          ```
          NOTES
          sed -i '' -e "s|@SUM@|$sum|" -e "s|@REPO@|$GITHUB_REPOSITORY|g" out/notes.md

      # A draft: publishing is a manual step after checking the notes and installing the DMG.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "Jetsam ${GITHUB_REF_NAME#v}" \
            --notes-file out/notes.md \
            out/Jetsam.dmg out/Jetsam.dmg.sha256
