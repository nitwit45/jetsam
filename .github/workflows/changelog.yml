name: Changelog

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changelog:
    # Dependency bumps do not need a user-facing line.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: CHANGELOG.md has a line for this PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" HEAD -- CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::add a line under \"## Unreleased\" describing this change"
            exit 1
          fi
